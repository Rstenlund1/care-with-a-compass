const CASE_LESSONS={"nose":{"heading":"Minor symptom, major supervisory responsibilities","paragraphs":["A nosebleed may be routine, but a director must simultaneously protect the injured child, prevent contact with blood, and keep the other children supervised. The first response should be based on the child's visible condition and established first-aid guidance, not assumptions about the eventual diagnosis.","Forward positioning with sustained pressure is the standard first-aid response for an alert child with an uncomplicated nosebleed. Serious symptoms, heavy bleeding, significant injury or bleeding that does not stop can change the urgency. A documented bleeding disorder or medication history may matter, but do not delay immediate care to obtain that history.","Treat all blood as potentially infectious. Use appropriate protective equipment, isolate spills and follow the facility's exposure-control procedure without singling out a child because of HIV or another status. Separately verify qualified staff coverage, notify the family appropriately and preserve factual records. A complaint or worsening symptoms after correct care is not, by itself, evidence of poor judgment."],"focus":"Prioritize first aid, blood precautions, real-time ratios, reassessment and record integrity."},"arm":{"heading":"An injury requires care and operational continuity","paragraphs":["An obvious deformity or altered hand sensation can signal an injury that needs urgent medical evaluation. Protect the child, minimize unnecessary movement and seek appropriate emergency help rather than using the parent's availability as a medical triage rule.","Before delegating transport or contact duties, count who is physically supervising the rest of the children. One qualified staff member cannot simultaneously escort a child and be counted in a classroom they have left.","Record observed signs and the timeline without diagnosing from appearance, and preserve any relevant video. A parent complaint is a separate development to manage factually; it does not change whether the initial protective decision was sound."],"focus":"Recognize urgency, maintain supervision and separate medical assessment from documentation."},"fight":{"heading":"Protection before punishment","paragraphs":["First separate the children, assess injuries and maintain continuous supervision. The fact that one child is upset or injured does not establish who initiated the altercation or why.","Disability supports, individualized plans and behavioral context can affect what prevention and response look like. They do not justify leaving others unsafe, nor should they be used to assume intent without evidence.","Communicate with families using each child's relevant facts, preserve confidentiality and establish an observation-based improvement plan. The leadership work continues after the immediate altercation ends."],"focus":"Separate immediate safety, individualized support, factual investigation and family communication."},"ill":{"heading":"Emergency action does not wait for family contact","paragraphs":["A child who becomes unexpectedly lethargic or seriously ill requires immediate assessment using the child's known emergency plan, trained staff and emergency services as indicated. Repeated unanswered phone calls cannot become a substitute for medical action.","Assign responsibilities: one person stays with the child, another contacts authorized adults, and qualified staff maintain safe coverage for everyone else. Recheck the actual roster whenever someone leaves the facility.","Coordinate the factual handoff and a safe discharge process with medical professionals. Transportation difficulties alone do not prove neglect, but objectively concerning facts may trigger separate reporting duties."],"focus":"Respond to clinical urgency first, then coordinate parents, responders, documentation and coverage."},"bus":{"heading":"A head-count discrepancy is an urgent safeguarding event","paragraphs":["An expected child missing from a classroom count requires an immediate, systematic search and confirmation of where the child was last seen. Do not rely on an incomplete sign-out record or assume the child stayed home.","Transportation safety requires a documented verification process, trained personnel and a second layer of accountability. Other children still require supervision while staff search.","If the investigation reveals an incident that threatens a child's safety, use the applicable notification and licensing-reporting thresholds. Do not treat a complete checklist as proof that the actual sweep happened."],"focus":"Search immediately, protect the other children, preserve original records and correct the process."},"bruise":{"heading":"Reasonable suspicion is not the same as proof","paragraphs":["Take unexplained injuries seriously while keeping observations separate from allegations and conclusions. Provide immediate care, note the child's exact spontaneous words and avoid repeated or leading interviews.","Where reasonable suspicion exists, mandated reporters must follow the applicable reporting duties without waiting to complete their own investigation. Supervisory approval is not a substitute for an individual mandated reporter's legal obligations.","Preserve records and protect confidentiality. Staff should not declare anyone guilty, but neither should uncertainty become a reason to ignore a child-safety concern."],"focus":"Recognize the reporting threshold, document neutrally and protect the child."},"parent":{"heading":"An authorized adult can still create an immediate safety problem","paragraphs":["When a pickup adult appears impaired, focus on what is observed rather than making a diagnosis or publicly humiliating the person. The child's immediate safety, authorized release rules and de-escalation all matter.","Know the facility's approved pickup and escalation procedures, including how to seek another authorized adult or emergency assistance when circumstances justify it. Do not invent legal authority to detain a person.","Record exact observations and actions, communicate only necessary information, and plan for future safe pickups. A family's anger after a sound decision is a management problem to address, not automatic proof the decision was wrong."],"focus":"Manage observed risks, verified authorization, safe alternatives and factual documentation."},"monitor":{"heading":"Transportation qualification cannot be improvised","paragraphs":["A transportation schedule does not turn an untrained employee into an eligible monitor. Confirm the relevant staffing, training and supervision requirements before deciding a route can leave.","Delaying departure can create inconvenience and pressure from families, but an unsafe workaround can create more serious risks. The director must communicate the reason for a delay, provide an authorized alternative and protect children awaiting transportation.","Document the operational failure and establish an actual relief plan, including training and coverage verification. A full roster is not evidence that each role is safely covered."],"focus":"Verify qualified coverage, protect children during delays and build a real contingency plan."}};
const STAGE_COACH=[["Priority and first action","In the first minute, separate urgent danger from information you would merely like to know. Put immediate care and supervision ahead of routine calls, appearance management and explanations.","Would your first action still make sense if the parent never answered?"],["Supervision and deployment","A person who is helping one child may no longer be available to supervise the rest. Recount actual qualified staff and present children whenever a role changes; the posted roster is not enough.","Who is accountable for every child while the response continues?"],["Concurrent hazards","A blood spill, distressed child or altered scene can create a second hazard. Assign safe containment and cleanup without interrupting necessary care or leaving the group under-supervised.","What new risk did the first intervention create?"],["Reassessment as facts change","The situation has evolved. Reassess symptoms, safety and what is verified; a good initial decision is not permission to stop observing. Conversely, new symptoms do not retroactively make an earlier appropriate decision wrong.","Which new observation should change your next action?"],["Communication without delay","Give families a factual, timely update without treating their response as a substitute for emergency judgment. Describe what was observed, what care was provided and what comes next.","How can you be transparent without guessing or sharing another child's information?"],["Relief staffing","Sending a qualified staff member away changes the live ratio and supervision picture. Verify qualified backup before making an assignment; if coverage is impossible, change operations rather than fabricate compliance.","What should stop, change or be delayed if no relief staff are available?"],["Evidence and confidentiality","Separate a direct observation from an inference, allegation or private medical detail. Collect only what is needed for safeguarding and the response; protect confidential records and avoid attributing fault prematurely.","Which facts can you defend from firsthand records?"],["Outcome versus decision quality","A symptom can improve, recur or worsen independently of whether the initial procedure was appropriate. Decisions should be judged against facts available at that moment, including new warning signs.","Would you still defend the decision if the next event went badly?"],["Documentation and preservation","Write an accurate timeline and preserve original footage, rather than reconstructing a convenient story after a complaint. Note uncertainty and restrict access appropriately.","What original record would you need if accounts conflict tomorrow?"],["Complaint and process","Families may complain even when the facility acted appropriately. Cooperate, preserve documents and respond to allegations with verified facts; a complaint is not a violation finding.","What would an independent reviewer be able to verify?"],["Different reporting duties","Child-abuse reports, licensing incident reports and routine family notifications are different duties with different thresholds. Apply the actual rule to established facts and avoid reporting every inconvenience as abuse or ignoring reportable harm.","Which duty is triggered by which fact, and by when?"],["Transfer to the next shift","A completed form or training attendance record does not prove safer practice. Assign corrective ownership and use observation, rehearsal and follow-up evidence to verify implementation.","What evidence tomorrow would show the problem is truly less likely to recur?"]];

function download(){let blob=new Blob([JSON.stringify({version:VERSION,session:session.seed,created:session.created,configuration:{type:session.type,children:session.startingChildren,staff:session.startingStaff},results:session.reports},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='care-with-a-compass-v10-practice-record.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function reset(){session=null;try{localStorage.removeItem(STORAGE)}catch(_){}render()}
function linkSource(code){let x=SOURCE[code]||SOURCE.supervision;return `<a target="_blank" rel="noopener noreferrer" href="${ESC(x.u)}">${ESC(x.t)}</a>`}
function instructions(){return `<details><summary>Training boundaries, scoring and references</summary><p>This is an original fictional educational demonstration. Cases inspired by themes in Head Start training are rewritten, not reproduced. Select three of eight scenarios without replacement and play twelve decisions each. Options, underlying facts, family reactions and adverse outcomes are randomized per session. A case is never terminated early for a mistake. Decisions are graded for defensible process, not whether a parent complains or an unforeseeable event occurs.</p><p>The optional classroom model uses simplified Title 22 teacher ratios: preschool 1:12, approved toddler component 1:6, and school-age center 1:14. All counted staff are assumed to meet the applicable qualification requirements and be physically supervising the modeled group. A center's actual license, staffing combinations, transportation rules, Title 5 funding, infant rules, and individual care needs may impose different requirements. Ratio alone does not establish safe supervision.</p><p>Never make real clinical, reporting or legal decisions based solely on this training prototype. Pediatric emergencies may require 911 immediately; standard precautions apply to all blood regardless of HIV or other known status. Do not infer a child's infection status from a nosebleed. Licensing reports under 22 CCR §101212 and mandated abuse reports under Penal Code §11166 are different legal duties with separate triggering thresholds. Independent clinical, legal, content and accessibility review is required before real-world use.</p><p>Key sources: ${['nose','aap','ems','ratio','toddler','school','blood','hiv','record','incident','mandated','hs'].map(k=>linkSource(k)).join(' · ')}</p><p>No network calls, live student identities, or Formspree account are required for this stand-alone lab. Results remain in your browser until exported or reset. Opening this file does not automatically affect the main v9.9.1 prototype or its completion certificate.</p></details>`}
function render(){let el=$('app');if(!session){el.innerHTML=`<section><span class="tag">Optional classroom simulator</span><h2>Choose your starting conditions</h2><p>One setting is carried through the three randomly assigned cases. The initial headcount matters: sending a qualified teacher away can create a new safety failure even after correct first aid.</p><form id="init" onsubmit="event.preventDefault();startFromForm()"><div class="two"><div><label for="type">Modeled classroom license category</label><select name="type" id="type"><option value="preschool">Preschool center · 1:12 teacher ratio</option><option value="toddler">Approved toddler component · 1:6</option><option value="school">School-age center · 1:14</option></select></div><div><label for="children">Children present (1–42)</label><input id="children" name="children" type="number" min="1" max="42" value="18" required></div><div><label for="staff">Qualified teachers physically supervising (1–8)</label><input id="staff" name="staff" type="number" min="1" max="8" value="2" required></div></div><p class="small">This is a simplified teacher ratio model, not a complete staffing determination. Set an intentionally insufficient ratio if you want to test how the program responds.</p><p id="formerr" class="unsafe" role="alert"></p><button class="primary" type="submit">Draw three random cases</button></form></section><section><h3>What makes this different</h3><p>Every selected case has twelve decisions, including recovery after mistakes. The correct response is not always the longest option. New facts can emerge after a good decision, parents may react unpredictably, and a complaint does not automatically change your process score.</p>${instructions()}</section>`;return}
let s=c();if(!s){let total=session.reports.reduce((x,r)=>x+r.score,0),max=108;el.innerHTML=`<section><p class="eyebrow">Three randomized scenarios completed</p><h2>Session debrief</h2><div class="stats"><div class="stat"><span>Process points</span><b>${total}/${max}</b></div><div class="stat"><span>Scenario depth</span><b>36</b></div><div class="stat"><span>Initial teaching ratio</span><b>1:${session.ratio}</b></div></div><p>Unsafe decisions and staffing gaps appear in the debrief even if the fictional ending was favorable. Conversely, a complaint or unfavorable turn does not reduce the score for otherwise sound decisions.</p>${session.reports.map((r,i)=>`<div class="card"><h3>${i+1}. ${ESC(r.title)} · ${r.score}/36</h3><p class="small">Random factual variant: ${ESC(r.variant)} · ${r.unsafe} unsafe decisions · ${r.coverageAlerts} ratio alerts</p><p>${ESC(r.clinical)}</p><details><summary>Inspect all 12 decisions and evidence</summary><ol>${r.log.map(v=>`<li><b>${ESC(v.title)}</b><div>${ESC(v.choice)}</div><div class="small">${ESC(v.why)}</div><div class="source">${linkSource(v.source)}</div></li>`).join('')}</ol></details></div>`).join('')}<div class="actions"><button class="primary" onclick="download()">Export anonymous decision record</button><button onclick="reset()">Start a new randomized practice</button></div></section>${instructions()}<footer>Session ${session.seed.toString(16)} · ${ESC(VERSION)} · educational simulation, not medical, legal or licensure advice</footer>`;return}
let spec=CASES.find(q=>q.id===s.id),sc=stage(s);if(!s.order&&!s.answered){let rs={rng:session.rng};s.order=shuffled(rs,sc.opts.map((_,i)=>i));session.rng=rs.rng;save()}
let compliant=s.children<=s.staff*session.ratio&&s.staff>0;
let header=`<section><p class="eyebrow">Random case ${session.index+1} of 3 · Decision ${Math.min(12,s.step+1)} of 12</p><h2>${ESC(spec.title)}</h2><p>${ESC(spec.theme)}</p><div class="progress" role="progressbar" aria-valuenow="${s.step}" aria-valuemin="0" aria-valuemax="12"><div style="width:${(s.step/12)*100}%"></div></div><div class="stats" style="margin-top:12px"><div class="stat"><span>Children present</span><b>${s.children}</b></div><div class="stat"><span>Qualified teachers</span><b>${s.staff}</b></div><div class="stat"><span>Required teachers · minimum</span><b>${Math.ceil(s.children/session.ratio)}</b></div><div class="stat"><span>Decision score</span><b>${s.score}/36</b></div></div>${compliant?'':`<p class="err"><strong>Ratio alert:</strong> ${s.children} children with ${s.staff} qualified teachers exceeds the simplified 1:${session.ratio} threshold. Additional active supervision duties still apply.</p>`}</section>`;
header+=lessonPanel(s);if(s.answered){let f=s.last,cl=f.grade===3?'feedback':f.grade===0?'feedback unsafe':'feedback partial';el.innerHTML=header+`<section class="${cl}" id="scene" tabindex="-1"><p class="eyebrow">Decision ${s.step+1} feedback · ${f.grade}/3 process points</p><h2>${f.grade===3?'Sound decision':f.grade===2?'Defensible with trade-offs':f.grade===1?'Incomplete response':'Unsafe response: recover next'}</h2><p><strong>Your choice:</strong> ${ESC(f.choice)}</p><p>${ESC(f.why)}</p>${decisionTeaching(s,sc,f)}${f.consequence?`<p class="banner">${ESC(f.consequence)}</p>`:''}<p class="source">Review: ${linkSource(f.source)}</p>${f.grade!==3?`<details><summary>View preferred actions after the decision</summary><p>${f.preferred.map(ESC).join(' / ')}</p></details>`:''}<button class="primary" onclick="advance()">${s.step===11?(session.index===2?'Finish practice':'Start next random case'):'Continue: the situation develops'}</button></section>${instructions()}<footer>Practice results remain local to this browser.</footer>`;$('scene').focus();return}
let opts=s.order.map((j,i)=>`<button type="button" onclick="answer(${i})" aria-label="Decision option ${i+1}">${ESC(sc.opts[j].t)}</button>`).join('');el.innerHTML=header+`<div class="layout"><section id="scene" tabindex="-1"><p class="eyebrow">${ESC(spec.origin)} · ${s.step+1}/12</p><h2>${ESC(sc.title)}</h2><p>${ESC(sc.body)}</p><h3>What do you do next?</h3><div class="buttons">${opts}</div><p class="small">Select the most defensible action given what you know *right now*. The result and supporting guidance appear before the situation continues.</p><p class="source">Guidance for this stage: ${linkSource(sc.src)}</p></section><aside><section><h3>Director’s dashboard</h3><p><b>Hidden factors:</b> underlying cause, family response and possible complaints are selected at the beginning of the case. They are revealed only when appropriate.</p><p><b>Recovery:</b> incorrect first steps do not end the case. Later good decisions count.</p><p><b>Scoring:</b> evidence-based process (0–3 per decision), not a guaranteed favorable ending.</p></section></aside></div>${instructions()}<footer>Fictional, original practice simulation · ${ESC(VERSION)} · session ${session.seed.toString(16)}</footer>`;$('scene').focus()}
render();
</script></body></html>
