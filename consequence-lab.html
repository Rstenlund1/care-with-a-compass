const CASE_LESSONS={"nose":{"heading":"Minor symptom, major supervisory responsibilities","paragraphs":["A nosebleed may be routine, but a director must simultaneously protect the injured child, prevent contact with blood, and keep the other children supervised. The first response should be based on the child's visible condition and established first-aid guidance, not assumptions about the eventual diagnosis.","Forward positioning with sustained pressure is the standard first-aid response for an alert child with an uncomplicated nosebleed. Serious symptoms, heavy bleeding, significant injury or bleeding that does not stop can change the urgency. A documented bleeding disorder or medication history may matter, but do not delay immediate care to obtain that history.","Treat all blood as potentially infectious. Use appropriate protective equipment, isolate spills and follow the facility's exposure-control procedure without singling out a child because of HIV or another status. Separately verify qualified staff coverage, notify the family appropriately and preserve factual records. A complaint or worsening symptoms after correct care is not, by itself, evidence of poor judgment."],"focus":"Prioritize first aid, blood precautions, real-time ratios, reassessment and record integrity."},"arm":{"heading":"An injury requires care and operational continuity","paragraphs":["An obvious deformity or altered hand sensation can signal an injury that needs urgent medical evaluation. Protect the child, minimize unnecessary movement and seek appropriate emergency help rather than using the parent's availability as a medical triage rule.","Before delegating transport or contact duties, count who is physically supervising the rest of the children. One qualified staff member cannot simultaneously escort a child and be counted in a classroom they have left.","Record observed signs and the timeline without diagnosing from appearance, and preserve any relevant video. A parent complaint is a separate development to manage factually; it does not change whether the initial protective decision was sound."],"focus":"Recognize urgency, maintain supervision and separate medical assessment from documentation."},"fight":{"heading":"Protection before punishment","paragraphs":["First separate the children, assess injuries and maintain continuous supervision. The fact that one child is upset or injured does not establish who initiated the altercation or why.","Disability supports, individualized plans and behavioral context can affect what prevention and response look like. They do not justify leaving others unsafe, nor should they be used to assume intent without evidence.","Communicate with families using each child's relevant facts, preserve confidentiality and establish an observation-based improvement plan. The leadership work continues after the immediate altercation ends."],"focus":"Separate immediate safety, individualized support, factual investigation and family communication."},"ill":{"heading":"Emergency action does not wait for family contact","paragraphs":["A child who becomes unexpectedly lethargic or seriously ill requires immediate assessment using the child's known emergency plan, trained staff and emergency services as indicated. Repeated unanswered phone calls cannot become a substitute for medical action.","Assign responsibilities: one person stays with the child, another contacts authorized adults, and qualified staff maintain safe coverage for everyone else. Recheck the actual roster whenever someone leaves the facility.","Coordinate the factual handoff and a safe discharge process with medical professionals. Transportation difficulties alone do not prove neglect, but objectively concerning facts may trigger separate reporting duties."],"focus":"Respond to clinical urgency first, then coordinate parents, responders, documentation and coverage."},"bus":{"heading":"A head-count discrepancy is an urgent safeguarding event","paragraphs":["An expected child missing from a classroom count requires an immediate, systematic search and confirmation of where the child was last seen. Do not rely on an incomplete sign-out record or assume the child stayed home.","Transportation safety requires a documented verification process, trained personnel and a second layer of accountability. Other children still require supervision while staff search.","If the investigation reveals an incident that threatens a child's safety, use the applicable notification and licensing-reporting thresholds. Do not treat a complete checklist as proof that the actual sweep happened."],"focus":"Search immediately, protect the other children, preserve original records and correct the process."},"bruise":{"heading":"Reasonable suspicion is not the same as proof","paragraphs":["Take unexplained injuries seriously while keeping observations separate from allegations and conclusions. Provide immediate care, note the child's exact spontaneous words and avoid repeated or leading interviews.","Where reasonable suspicion exists, mandated reporters must follow the applicable reporting duties without waiting to complete their own investigation. Supervisory approval is not a substitute for an individual mandated reporter's legal obligations.","Preserve records and protect confidentiality. Staff should not declare anyone guilty, but neither should uncertainty become a reason to ignore a child-safety concern."],"focus":"Recognize the reporting threshold, document neutrally and protect the child."},"parent":{"heading":"An authorized adult can still create an immediate safety problem","paragraphs":["When a pickup adult appears impaired, focus on what is observed rather than making a diagnosis or publicly humiliating the person. The child's immediate safety, authorized release rules and de-escalation all matter.","Know the facility's approved pickup and escalation procedures, including how to seek another authorized adult or emergency assistance when circumstances justify it. Do not invent legal authority to detain a person.","Record exact observations and actions, communicate only necessary information, and plan for future safe pickups. A family's anger after a sound decision is a management problem to address, not automatic proof the decision was wrong."],"focus":"Manage observed risks, verified authorization, safe alternatives and factual documentation."},"monitor":{"heading":"Transportation qualification cannot be improvised","paragraphs":["A transportation schedule does not turn an untrained employee into an eligible monitor. Confirm the relevant staffing, training and supervision requirements before deciding a route can leave.","Delaying departure can create inconvenience and pressure from families, but an unsafe workaround can create more serious risks. The director must communicate the reason for a delay, provide an authorized alternative and protect children awaiting transportation.","Document the operational failure and establish an actual relief plan, including training and coverage verification. A full roster is not evidence that each role is safely covered."],"focus":"Verify qualified coverage, protect children during delays and build a real contingency plan."}};
const STAGE_COACH=[["Priority and first action","In the first minute, separate urgent danger from information you would merely like to know. Put immediate care and supervision ahead of routine calls, appearance management and explanations.","Would your first action still make sense if the parent never answered?"],["Supervision and deployment","A person who is helping one child may no longer be available to supervise the rest. Recount actual qualified staff and present children whenever a role changes; the posted roster is not enough.","Who is accountable for every child while the response continues?"],["Concurrent hazards","A blood spill, distressed child or altered scene can create a second hazard. Assign safe containment and cleanup without interrupting necessary care or leaving the group under-supervised.","What new risk did the first intervention create?"],["Reassessment as facts change","The situation has evolved. Reassess symptoms, safety and what is verified; a good initial decision is not permission to stop observing. Conversely, new symptoms do not retroactively make an earlier appropriate decision wrong.","Which new observation should change your next action?"],["Communication without delay","Give families a factual, timely update without treating their response as a substitute for emergency judgment. Describe what was observed, what care was provided and what comes next.","How can you be transparent without guessing or sharing another child's information?"],["Relief staffing","Sending a qualified staff member away changes the live ratio and supervision picture. Verify qualified backup before making an assignment; if coverage is impossible, change operations rather than fabricate compliance.","What should stop, change or be delayed if no relief staff are available?"],["Evidence and confidentiality","Separate a direct observation from an inference, allegation or private medical detail. Collect only what is needed for safeguarding and the response; protect confidential records and avoid attributing fault prematurely.","Which facts can you defend from firsthand records?"],["Outcome versus decision quality","A symptom can improve, recur or worsen independently of whether the initial procedure was appropriate. Decisions should be judged against facts available at that moment, including new warning signs.","Would you still defend the decision if the next event went badly?"],["Documentation and preservation","Write an accurate timeline and preserve original footage, rather than reconstructing a convenient story after a complaint. Note uncertainty and restrict access appropriately.","What original record would you need if accounts conflict tomorrow?"],["Complaint and process","Families may complain even when the facility acted appropriately. Cooperate, preserve documents and respond to allegations with verified facts; a complaint is not a violation finding.","What would an independent reviewer be able to verify?"],["Different reporting duties","Child-abuse reports, licensing incident reports and routine family notifications are different duties with different thresholds. Apply the actual rule to established facts and avoid reporting every inconvenience as abuse or ignoring reportable harm.","Which duty is triggered by which fact, and by when?"],["Transfer to the next shift","A completed form or training attendance record does not prove safer practice. Assign corrective ownership and use observation, rehearsal and follow-up evidence to verify implementation.","What evidence tomorrow would show the problem is truly less likely to recur?"]];
function lessonPanel(s){const v=CASE_LESSONS[s.id];if(!v)return '';return '<section class="card" aria-label="Case lesson"><details><summary><strong>Review the learning lesson: '+ESC(v.heading)+'</strong></summary>'+v.paragraphs.map(p=>'<p>'+ESC(p)+'</p>').join('')+'<p><strong>Learning objective:</strong> '+ESC(v.focus)+'</p><p class="small">This optional lesson explains governing principles without revealing which development will occur.</p></details></section>';}
function decisionTeaching(s,sc,f){const guide=STAGE_COACH[s.step]||STAGE_COACH[0];const notBest=sc.opts.filter(o=>o.g<3).sort((a,b)=>b.g-a.g)[0];const preferred=sc.opts.filter(o=>o.g===3);const selectedError=f.grade<3?'<p><strong>What was missing:</strong> '+ESC(f.why)+'</p>':'';let contrast='';if(f.grade===3&&notBest){contrast='<p><strong>Why a plausible alternative is weaker:</strong> '+ESC(notBest.t)+' — '+ESC(notBest.w)+'</p>'} else if(f.grade<3&&preferred.length){contrast='<p><strong>A stronger action:</strong> '+ESC(preferred[0].t)+' — '+ESC(preferred[0].w)+'</p>';}return '<div class="card" style="box-shadow:none;background:#f8f6fb"><h3>Director\'s lesson: '+ESC(guide[0])+'</h3><p><strong>Why this decision matters:</strong> '+ESC(guide[1])+'</p>'+selectedError+contrast+'<p><strong>Transfer question:</strong> '+ESC(guide[2])+'</p><p class="small">The process score reflects decision quality with the information available now, not whether the fictional outcome turns out favorably.</p></div>';}

ritten.","A complete export can be verified later; preserve the original first.","Checking additional angles strengthens evidence, but may be too late if the primary recording overwrites.","Selecting only favorable clips before retaining the original risks a misleading record.","Failing to save time-limited footage can permanently eliminate relevant evidence."],["Provide licensing with preserved, accurate records through an authorized point of contact.","Designating a liaison is useful when they can produce the original records accurately.","A contemporaneous record is valuable, but the program must still respond to authorized inquiries.","Staff consensus is not a substitute for source records, especially if accounts conflict.","Destroying records in anticipation of an inquiry creates a serious integrity violation."],["Medical-event licensing notices and suspected-abuse reporting require separate evaluations and deadlines.","Consider both report categories rather than assuming the medical record covers the allegation.","Verify responsible reporters and timing, but do not defer duties that are already clear.","The hospital does not decide whether an educator must make a mandated report.","One completed form does not necessarily satisfy all statutory reporting obligations."],["Rehearse the emergency handoff and verified relief plan, then measure whether it works.","Testing an alternate escort reveals whether qualifying supervision survives the handoff.","A focused debrief identifies bottlenecks, but changes should also be tested.","A revised document alone is not evidence of actual emergency coverage.","Repeating an untested plan leaves the same staffing vulnerability in place."]],"staffingGap":[["Count only qualified adults physically available and limit admission until coverage supports the actual number of children.","A brief intake pause helps, but capacity must be recalculated before new admissions.","Calling the relief roster is necessary, but a replacement cann ange.","Training reminders without a backup budget leave the operational shortage intact.","Repeating a memo without a tested coverage system does not fix repeated shortages."],["Reportability depends on what actually happened and the applicable licensing duties, not whether anyone was injured.","Document the real supervision lapse before choosing the reporting pathway.","Review deadlines and evidence rather than asserting blanket exemptions.","No visible injury does not necessarily mean no reportable threat to child safety occurred.","A ratio or supervision lapse cannot be dismissed without examining its facts and consequences."],["Verify that qualified relief will actually be available before approving the next opening schedule.","A rehearsal can uncover a hypothetical gap that the written roster misses.","A funded reserve plus escalation plan is stronger when staff availability is confirmed.","A verbal maybe from a backup worker does not constitute committed coverage.","Approving the same minimum plan without reliable backup repeats a known weakness."]]};

function infantLimit(type,children,staff){
 if(!familyMode(type))return 0;
 const n=Math.max(0,Math.min(maxChildren(type),Math.floor(Number(children)||0)));

function infantRuleText(type,children,staff){

 const n=Number(children);
 if(type==='familyLarge'&&Number(staff)>=2)return n>=13?'At 13–14 children, no more than 3 may be infants.':'With an assistant, large homes may have up to 4 infants at 12 or fewer children.';
 if(n===4)return 'Four infants are permitted only when all four children are infants. With any older child, the maximum is 3 infants.';
 if(n>=7)return 'At 7–8 children, no more than 2 may be infants. School-age and notice conditions are assumed.';

 if(!Number.isInteger(staff)||staff<1)return fail('At least one qualified supervising adult must be present.');
 if(!home)return staff>=need?{ok:true,need,reason:'Center ratio met.'}:fail('Center staffing falls below the modeled minimum.');
 if(!Number.isInteger(infants)||infants<0||infants>children)return fail('Enter the number of children under age two.');

else if(s.step===9&&s.unfortunate)consequence='A licensing complaint is filed. This can happen even if the learner used sound procedures; a complaint is not a violation finding.';
else if(opt.g===0)consequence='The situation continues. The next decision remains available; correcting course matters.';
else if(opt.g===3&&s.step!==11)consequence='A reasonable action was taken. New facts can still change what happens next.';
s.log.push({step:s.step+1,title:sc.title,choice:opt.t,grade:opt.g,why:opt.w,consequence,children:s.children,staff:s.staff,source:sc.src});s.last={grade:opt.g,why:opt.w,consequence,choice:opt.t,source:sc.src,preferred:sc.opts.filter(o=>o.g===3).map(o=>o.t)};s.answered=true;save();render()}
function advance(){let s=c();if(!s||!s.answered)return;s.step++;s.order=null;s.answered=false;s.last=null;if(s.step>=12){let clinical=s.unfortunate?'An unfavorable external event occurred despite the possibility of appropriate decisions. This is not scored as a learner error.':'A stable outcome was observed, although clinical certainty is not assumed.';let compliant=currentCoverage(s).ok;let result={id:s.id,title:CASES.find(x=>x.id===s.id).title,variant:s.variant,parent:s.parent,score:s.score,max:36,correct:s.correct,unsafe:s.unsafe,courseCorrections:s.repair||0,coverageAlerts:s.issues.filter(x=>x.startsWith('Coverage')).length,clinical,compliant,issues:s.issues,adjustments:s.adjustments||[],log:s.log,seed:session.seed};session.reports.push(result);session.index++;beginCase();}save();render()}
function startingModelPreview(){
 const f=$('init');if(!f)return;
 const type=f.elements.namedItem('type').value,home=familyMode(type);
 const olderInput=f.elements.namedItem('children'),staffInput=f.elements.namedItem('staff'),infantInput=f.elements.namedItem('infants');
 olderInput.max=maxChildren(type);olderInput.min=home?0:1;
 if(Number(olderInput.value)>maxChildren(type))olderInput.value=maxChildren(type);
 const older=Number(olderInput.value),staff=Number(staffInput.value),maxInfants=maxInfantsForOlder(type,older);
 const infants=home?Math.max(0,Math.min(Number(infantInput.value)||0,maxInfants)):0,total=older+infants;
 infantInput.max=maxInfants;infantInput.value=infants;
 $('familyFields').hidden=!home;$('startOlderLabel').textContent=home?'Children age 2 and older':'Children present';
 const note=$('startInfantsRule');if(note)note.textContent=infantRuleText(type,total,staff);
 const check=coverage(type,total,staff,infants,true);
 $('startChildrenDisplay').value=String(older);$('startStaffDisplay').value=String(staff);$('startInfantsDisplay').value=String(infants);
 const status=$('startRatioStatus');
 status.textContent=(check.ok?'Modeled coverage: ':'Coverage alert: ')+(home?`${total} total children (${older} age 2+, ${infants} infants). `:`${total} children. `)+check.reason;
 status.className=check.ok?'projection safe':'err';
}
function currentModelPreview(){
 const s=c();if(!s)return;
 const a=$('modelChildren'),b=$('modelTeachers'),inf=$('modelInfants'),o=$('modelPreviewStatus');
 if(!a||!b||!o)return;
 const older=Number(a.value),staff=Number(b.value);
 if(inf){const limit=maxInfantsForOlder(session.type,older);inf.max=limit;
  if(Number(inf.value)>limit)inf.value=limit;
  const note=$('modelInfantsRule');if(note)note.textContent=infantRuleText(session.type,older+Number(inf.value),staff);
 }
 const infants=inf?Number(inf.value):0,total=older+infants,check=coverage(session.type,total,staff,infants,true);
 $('modelChildrenCount').value=String(older);$('modelTeachersCount').value=String(staff);
 if(inf)$('modelInfantsCount').value=String(infants);
 o.textContent=(inf?`${total} total children (${older} age 2+, ${infants} infants). `:`${total} children. `)+check.reason;
 o.className=check.ok?'projection safe':'err';
}
function applyModelAdjustment(){
 const s=c(),a=document.getElementById('modelChildren'),b=document.getElementById('modelTeachers'),inf=document.getElementById('modelInfants');
 if(!s||s.answered||!a||!b)return;
 const older=Number(a.value),staff=Number(b.value),infants=inf?Number(inf.value):0,children=older+infants;
 if(!Number.isInteger(older)||older<0||!Number.isInteger(children)||!Number.isInteger(staff)||children<1||children>maxChildren(session.type)||staff<0||staff>8||infants<0||infants>children||infants>maxInfantsForOlder(session.type,older))return;
 if(children===s.children&&staff===s.staff&&infants===(s.infants||0))return;
 s.adjustments??=[];s.adjustments.push({beforeDecision:s.step+1,previous:{children:s.children,staff:s.staff,infants:s.infants||0},after:{children,staff,infants},description:'Learner-modeled staffing and attendance change; availability and age mix require real-world verification.'});
 s.children=children;s.staff=staff;s.infants=infants;
 const check=currentCoverage(s);if(!check.ok){s.critical++;s.issues.push('Coverage alert after learner adjustment before decision '+(s.step+1)+': '+check.reason)}
 save();render();
}
function staffingModelControls(s){
 const home=familyMode(session.type),check=currentCoverage(s);
 return `<details id="labStaffingControls" class="card" aria-label="Adjust staffing and attendance"><summary>Adjust classroom staffing or attendance</summary><h3>Staffing and attendance</h3><p class="small">Explore how children present, infant mix and qualified coverage affect the next decision.</p><div class="model-grid"><div><label for="modelChildren"><span id="modelOlderLabel">${home?"Children age 2 and older":"Children present"}</span>: <output id="modelChildrenCount">${home?Math.max(0,s.children-(s.infants||0)):s.children}</output></label><input id="modelChildren" type="range" min="${home?0:1}" max="${maxChildren(session.type)}" value="${home?Math.max(0,s.children-(s.infants||0)):s.children}" oninput="currentModelPreview()"></div><div><label for="modelTeachers">Qualified adults present: <output id="modelTeachersCount">${s.staff}</output></label><input id="modelTeachers" type="range" min="0" max="8" value="${s.staff}" oninput="currentModelPreview()"></div>${home?`<div><label for="modelInfants">Infants under age two: <output id="modelInfantsCount">${s.infants||0}</output></label><input id="modelInfants" type="range" min="0" max="${maxInfantsForOlder(session.type,Math.max(0,s.children-(s.infants||0)))}" value="${Math.min(s.infants||0,maxInfantsForOlder(session.type,Math.max(0,s.children-(s.infants||0))))}" oninput="currentModelPreview()"><p class="small" id="modelInfantsRule">${ESC(infantRuleText(session.type,s.children,s.staff))}</p></div>`:''}</div><p class="projection" id="modelPreviewStatus" role="status">${ESC(check.reason)}</p><button type="button" onclick="applyModelAdjustment()">Apply change and record it</button><p class="small">Adjustments remain in the case history. Family home capacity also depends on verified age mix, licensed capacity, and qualifying adults.</p></details>`;
}
function startFromForm(){
 const f=$('init');if(!f)return;
 const type=f.elements.namedItem('type').value,older=Number(f.elements.namedItem('children').value),
 staff=Number(f.elements.namedItem('staff').value),infants=familyMode(type)?Number(f.elements.namedItem('infants').value):0;
 const total=older+infants;
 if(!ratioByType[type]||!Number.isInteger(older)||older<0||!Number.isInteger(total)||total<1||total>maxChildren(type)||
  !Number.isInteger(staff)||staff<1||staff>8||!Number.isInteger(infants)||infants<0||infants>maxInfantsForOlder(type,older)){
  $('formerr').textContent='Choose a permitted total number of children, infant mix, and staffing.';return;
 }
 window.__cwcInitialInfants=infants;prepare(type,total,staff);render();
}
function download(){let blob=new Blob([JSON.stringify({version:VERSION,session:session.seed,created:session.created,configuration:{type:session.type,children:session.startingChildren,staff:session.startingStaff},results:session.reports},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='care-with-a-compass-v10-practice-record.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function reset(){session=null;try{localStorage.removeItem(STORAGE)}catch(_){}render()}
function caseCredit(s){return ['bus','bruise','parent','monitor'].includes(s.id)?'<p class="source">Scenario theme adapted from the Office of Head Start’s <em>List of Training Scenarios</em>. This simulation’s narrative, choices, outcomes, and scoring are original; Head Start does not sponsor or endorse it. '+linkSource('hs')+'</p>':''}
function linkSource(code){let x=SOURCE[code]||SOURCE.supervision;return `<a target="_blank" rel="noopener noreferrer" href="${ESC(x.u)}">${ESC(x.t)}</a>`}
function instructions(){return `<details><summary>Training boundaries, scoring and references</summary><p>This is an original fictional educational demonstration. Selected case premises are adapted from the Office of Head Start's <em>List of Training Scenarios</em>; all decision options, branching events, scoring, and instructional responses are original additions, not official Head Start training or an endorsement. See ${linkSource('hs')}. Cases inspired by themes in Head Start training are rewritten, not reproduced. Each session contains three scenarios with twelve decisions each. Options, underlying facts, family reactions and adverse outcomes are varied between sessions. A case is never terminated early for a mistake. Decisions are graded for defensible process, not whether a parent complains or an unforeseeable event occurs.</p><p>The optional staffing model uses simplified Title 22 center teacher ratios and separately models small and large family child care home capacity under §102416.5, including infants and extended-capacity criteria. Qualifying school-age mix and parent notifications are assumed for the exercise. All counted staff are assumed to meet the applicable qualification requirements and be physically supervising the modeled group. A center's actual license, staffing combinations, transportation rules, Title 5 funding, infant rules, and individual care needs may impose different requirements. Ratio alone does not establish safe supervision.</p><p>Never make real clinical, reporting or legal decisions based solely on this training prototype. Pediatric emergencies may require 911 immediately; standard precautions apply to all blood regardless of HIV or other known status. Do not infer a child's infection status from a nosebleed. Licensing reports under 22 CCR §101212 and mandated abuse reports under Penal Code §11166 are different legal duties with separate triggering thresholds. Independent clinical, legal, content and accessibility review is required before real-world use.</p><p>Key sources: ${['nose','aap','ems','ratio','toddler','school','blood','hiv','record','incident','mandated','hs','hsSafety','transport'].map(k=>linkSource(k)).join(' · ')}</p></details>`}
function render(){let el=$('app');if(!session){el.innerHTML=`<section><span class="tag">Applied leadership simulations</span><h2>Choose your starting conditions</h2><p>Your license type, child enrollment, infant mix, and available adults shape three unfolding leadership scenarios. Each decision can change the situation, creating new challenges that require sound supervisory judgment.</p><form id="init" onsubmit="event.preventDefault();startFromForm()"><div class="two"><div><label for="type">Modeled classroom license category</label><select name="type" id="type" onchange="startingModelPreview()"><option value="preschool">Preschool center · 1:12 teacher ratio</option><option value="toddler">Approved toddler component · 1:6</option><option value="school">School-age center · 1:14</option><option value="familySmall">Small Family Child Care Home · up to 8</option><option value="familyLarge">Large Family Child Care Home · up to 14</option></select></div><div><label for="children"><span id="startOlderLabel">Children present</span>: <output id="startChildrenDisplay">18</output></label><input id="children" name="children" type="range" min="1" max="42" step="1" value="18" oninput="startingModelPreview()" required></div><div><label for="staff">Qualified supervising adults present: <output id="startStaffDisplay">2</output></label><input id="staff" name="staff" type="range" min="1" max="8" step="1" value="2" oninput="startingModelPreview()" required></div></div><div id="familyFields" hidden><div class="two"><div><label for="infants">Infants under age two: <output id="startInfantsDisplay">0</output></label><input id="infants" name="infants" type="range" min="0" max="4" value="0" oninput="startingModelPreview()"><p id="startInfantsRule" class="small">Infant limits adjust to total attendance and staff.</p></div></div><p class="source">California Title 22 §102416.5: <a target="_blank" rel="noopener noreferrer" href="https://www.law.cornell.edu/regulations/california/22-CCR-102416.5">Staffing ratio and capacity</a>. Large homes require an assistant for large-home limits.</p></div><p class="projection" id="startRatioStatus" role="status">Modeled coverage: 2 qualified teachers for 18 children; minimum 2.</p><p class="small">This model automatically limits infant counts by age mix and assumes the expanded-capacity conditions. You can still test insufficient staffing; actual licensure and supervision require verification.</p><p id="formerr" class="unsafe" role="alert"></p><button class="primary" type="submit">Begin simulations</button></form></section><section><h3>Decisions are only the beginning</h3><p>Each case continues for twelve decisions. Every choice is followed by an explanation, and you can correct course after a mistake. A difficult outcome does not automatically mean your earlier decision was wrong.</p>${instructions()}</section>`;startingModelPreview();return}
let s=c();if(!s){if(window.parent!==window)window.parent.postMessage({app:'cwc-consequence-lab',kind:'lab-completed',mode:'unified',completed:true},window.location.origin);let total=session.reports.reduce((x,r)=>x+r.score,0),max=108;el.innerHTML=`<section><p class="eyebrow">Applied simulations completed</p><h2>Session debrief</h2><div class="stats"><div class="stat"><span>Process points</span><b>${total}/${max}</b></div><div class="stat"><span>Scenario depth</span><b>36</b></div><div class="stat"><span>Starting supervision model</span><b>${familyMode(session.type)?'Family home':'1:'+session.ratio}</b></div></div><p>Unsafe decisions and staffing gaps appear in the debrief even if the fictional ending was favorable. Conversely, a complaint or unfavorable turn does not reduce the score for otherwise sound decisions.</p>${session.reports.map((r,i)=>`<div class="card"><h3>${i+1}. ${ESC(r.title)} · ${r.score}/36</h3><p class="small">Scenario variation: ${ESC(r.variant)} · ${r.unsafe} unsafe decisions · ${r.courseCorrections||0} later defensible responses after an unsafe choice · ${r.coverageAlerts} ratio alerts</p><p>${ESC(r.clinical)}</p><p class="small">${(r.adjustments||[]).length} classroom staffing changes recorded</p><details><summary>Inspect all 12 decisions and evidence</summary><ol>${r.log.map(v=>`<li><b>${ESC(v.title)}</b><div>${ESC(v.choice)}</div><div class="small">${ESC(v.why)}</div><div class="source">${linkSource(v.source)}</div></li>`).join('')}</ol></details></div>`).join('')}<div class="actions"><button class="primary" onclick="download()">Export anonymous decision record</button><button onclick="reset()">Start another practice session</button></div></section>${instructions()}<footer>Session ${session.seed.toString(16)} · ${ESC(VERSION)} · educational simulation, not medical, legal or licensure advice</footer>`;return}
let spec=CASES.find(q=>q.id===s.id),sc=stage(s);if(!s.order&&!s.answered){let rs={rng:session.rng};s.order=shuffled(rs,sc.opts.map((_,i)=>i));session.rng=rs.rng;save()}
let check=currentCoverage(s),compliant=check.ok;const intakeProjection=s.id==='staffingGap'&&s.intakePending;
let header=`<section><p class="eyebrow">Case ${session.index+1} of 3 · Decision ${Math.min(12,s.step+1)} of 12</p><h2>${ESC(spec.title)}</h2><p>${ESC(spec.theme)}</p><div class="progress" role="progressbar" aria-valuenow="${s.step}" aria-valuemin="0" aria-valuemax="12"><div style="width:${(s.step/12)*100}%"></div></div><div class="stats" style="margin-top:12px"><div class="stat"><span>${s.id==="staffingGap"?(s.intakePending?"Scheduled arrivals":"Children admitted"):"Children present"}</span><b>${s.children}</b></div><div class="stat"><span>Qualified adults</span><b>${s.staff}</b></div><div class="stat"><span>Supervising adults · minimum</span><b>${check.need}</b></div><div class="stat"><span>Decision score</span><b>${s.score}/36</b></div></div></section>`;
const ratioNotice=compliant||intakeProjection?'':`<p class="err" id="coverageAlert" role="alert"><strong>Coverage alert:</strong> ${ESC(check.reason)} Current count: ${s.children} total children${s.infants?` (${s.children-s.infants} age 2+, ${s.infants} infants)`:''} and ${s.staff} qualified supervising adults.</p>`;if(s.answered){let f=s.last,cl=f.grade===3?'feedback':f.grade===0?'feedback unsafe':'feedback partial';el.innerHTML=header+`<section class="${cl}" id="scene" tabindex="-1">${ratioNotice}<p class="eyebrow">Decision ${s.step+1} feedback · ${f.grade}/3 process points</p><h2>${f.grade===3?'Sound decision':f.grade===2?'Defensible with trade-offs':f.grade===1?'Incomplete response':'Unsafe response: recover next'}</h2><p><strong>Your choice:</strong> ${ESC(f.choice)}</p><p>${ESC(f.why)}</p>${decisionTeaching(s,sc,f)}${f.consequence?`<p class="banner">${ESC(f.consequence)}</p>`:''}<p class="source">Review: ${linkSource(f.source)}</p>${f.grade!==3?`<details><summary>View preferred actions after the decision</summary><p>${f.preferred.map(ESC).join(' / ')}</p></details>`:''}<button class="primary" onclick="advance()">${s.step===11?(session.index===2?'Finish practice':'Continue to next case'):'Continue: the situation develops'}</button></section>${instructions()}<footer>Practice results remain local to this browser.</footer>`;$('scene').focus();return}
let opts=s.order.map((j,i)=>`<button type="button" onclick="answer(${i})" aria-label="Decision option ${i+1}">${ESC(sc.opts[j].t)}</button>`).join('');el.innerHTML=header+`<div class="layout"><section id="scene" tabindex="-1">${ratioNotice}<p class="eyebrow">Decision ${s.step+1} of 12</p><h2>${ESC(sc.title)}</h2><p>${ESC(sc.body)}</p><h3>What do you do next?</h3><div class="buttons">${opts}</div><p class="small">Select the most defensible action given what you know right now. The result and supporting guidance appear before the situation continues.</p><p class="source">Guidance for this stage: ${linkSource(sc.src)}${['bus','bruise','parent','monitor'].includes(s.id)?` · Scenario inspiration: ${linkSource('hs')}`:''}${['bus','monitor'].includes(s.id)?` · Head Start transportation standard: ${linkSource('transport')}`:''}</p></section><aside><section><h3>Director’s dashboard</h3><p><b>Watch for new developments:</b> clinical findings, family responses, and operational pressures may change what the next responsible action requires.</p><p><b>Recovery:</b> incorrect first steps do not end the case. Later good decisions count.</p><p><b>Scoring:</b> evidence-based process (0–3 per decision), not a guaranteed favorable ending.</p></section></aside></div><details class="card" style="margin-top:12px"><summary>Review the case lesson and guidance</summary>${lessonPanel(s)}</details>${staffingModelControls(s)}${caseCredit(s)}${instructions()}<footer>Fictional, original practice simulation · ${ESC(VERSION)} · session ${session.seed.toString(16)}</footer>`;$('scene').focus()}
render();
if(window.parent!==window){
 let lastHeight=0;
 const sendHeight=()=>{
  const lab=document.getElementById("app");
  if(!lab)return;
  const measured=Math.ceil(lab.getBoundingClientRect().bottom+18);
  if(measured>200&&Math.abs(measured-lastHeight)>2){
   lastHeight=measured;
   window.parent.postMessage({app:"cwc-consequence-lab",kind:"lab-height",height:measured},window.location.origin);
  }
 };
 new MutationObserver(()=>requestAnimationFrame(sendHeight)).observe(document.getElementById("app"),{childList:true,subtree:true,characterData:true});
 if(typeof ResizeObserver!=="undefined")new ResizeObserver(sendHeight).observe(document.getElementById("app"));
 window.addEventListener("load",sendHeight);
 requestAnimationFrame(sendHeight);
}
</script></body></html>
